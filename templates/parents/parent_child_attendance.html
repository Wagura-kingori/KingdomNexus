{% extends 'dashboard_base.html' %}
{% block content %}
<h2>Attendance – {{ child.first_name }}</h2>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for a in attendance %}
        <tr>
            <td>{{ a.date }}</td>
            <td>
                {% if a.status == 'P' %}
                <span class="badge bg-success">Present</span>
                {% else %}
                <span class="badge bg-danger">Absent</span>
                {% endif %}
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center">No attendance recorded.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
