{% extends "base.html" %}

{% block content %}
<h2>Add New School</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Save School
    </button>

    <a href="{% url 'schools:setup_dashboard' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
