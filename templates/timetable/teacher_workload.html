<h2>{{ teacher.user.get_full_name }} Workload</h2>

<table border="1" cellpadding="8">
<tr>
    <th>Day</th>
    <th>Time</th>
    <th>Class</th>
    <th>Subject</th>
</tr>

{% for e in entries %}
<tr>
    <td>{{ e.day|title }}</td>
    <td>{{ e.start_time }} - {{ e.end_time }}</td>
    <td>{{ e.classroom }}</td>
    <td>{{ e.subject.name }}</td>
</tr>
{% endfor %}
</table>
