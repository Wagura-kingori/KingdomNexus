{% load timetable_tags %}
<h2>{{ classroom }} Timetable Setup</h2>

<form method="post">
    {% csrf_token %}

    <table border="1" cellpadding="8">
        <tr>
            <th>Subject</th>
            <th>Teacher</th>
            <th>Lessons / Week</th>
        </tr>

        {% for a in assignments %}
        <tr>
            <td>{{ a.subject.name }}</td>
            <td>{{ a.teacher.user.get_full_name }}</td>
            <td>
                <input
                    type="number"
                    min="1"
                    max="10"
                    name="subject_{{ a.subject.id }}"
                    value="{{ existing|get_item:a.subject.id|default:4 }}"
                >
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <button type="submit">Save Setup</button>
</form>

<br>

<a href="{% url 'timetable:generate' classroom.id %}">
    Generate Timetable
</a>
