{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

    <h3>{{ form.instance.id|yesno:"Edit Issue,Issue Asset" }}</h3>

    <div class="card shadow-sm p-4 mt-3">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success">Save</button>
            <a href="{% url 'issue_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>

</div>
{% endblock %}
