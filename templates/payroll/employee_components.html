{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Salary Components — {{ emp.name }}</h2>

    <form method="post" class="card p-3 mb-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success">Add Component</button>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Component</th>
                <th>Amount</th>
                <th>Type</th>
            </tr>
        </thead>
        <tbody>
            {% for c in components %}
            <tr>
                <td>{{ c.component.name }}</td>
                <td>{{ c.amount }}</td>
                <td>{{ c.component.kind }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
