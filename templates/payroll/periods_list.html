{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Payroll Periods</h2>
    <a href="{% url 'payroll:period_add' %}" class="btn btn-primary mb-3">Add Period</a>

    <table class="table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Start</th>
                <th>End</th>
                <th>Processed</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for p in periods %}
            <tr>
                <td>{{ p.name }}</td>
                <td>{{ p.start_date }}</td>
                <td>{{ p.end_date }}</td>
                <td>{% if p.processed %}Yes{% else %}No{% endif %}</td>
                <td>
                    <a href="{% url 'payroll:period_edit' p.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'payroll:process_payroll' p.id %}" class="btn btn-sm btn-success"
                        onclick="return confirm('Process payroll for {{ p.name }}?');">Process</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
