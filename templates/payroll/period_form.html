{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ form.instance.pk|yesno:"Edit Payroll Period,Add Payroll Period" }}</h2>

    <form method="post" class="card p-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success">Save</button>
        <a href="{% url 'payroll:periods' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
