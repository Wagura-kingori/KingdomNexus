
{% extends "exams/exams_base.html" %}
{% block exam_title %}Edit Exam Type — {{ type.name }}{% endblock %}
{% block nav_types %}active{% endblock %}

{% block exam_content %}
<div class="exm-page-header">
    <div class="exm-pg-label">Exam Types</div>
    <h1 class="exm-page-title">Edit: {{ type.name }}</h1>
</div>

<div class="exm-card" style="max-width:580px;">
    <div class="exm-card-head">
        <span class="exm-card-icon"><i class="fas fa-pen"></i></span>
        <h6>Edit Type Details</h6>
    </div>
    <div class="exm-card-body">
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="exm-field">
                <label class="exm-lbl">Name <span class="req">*</span></label>
                <input type="text" name="name" value="{{ type.name }}" placeholder="e.g. Mid-term" class="exm-input" autocomplete="off">
            </div>
            <div class="exm-actions">
                <button type="submit" class="exm-btn exm-btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{% url 'exams:exam_types_list' %}" class="exm-btn exm-btn-ghost"><i class="fas fa-times"></i> Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
