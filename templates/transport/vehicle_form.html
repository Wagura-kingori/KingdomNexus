{% extends 'base.html' %}
{% block title %}Vehicle Form{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3>{{ title }}</h3>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success">Save</button>
        <a href="{% url 'transport:vehicles' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
