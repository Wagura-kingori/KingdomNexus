{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Add/Edit Enrollment</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save</button>
        <a href="{% url 'academics:enrollments_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
