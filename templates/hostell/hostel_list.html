{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Hostels</h2>

    <a href="{% url 'hostel_add' %}" class="btn btn-primary mb-3">+ Add Hostel</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Location</th>
                <th>Warden</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for h in hostels %}
            <tr>
                <td>{{ h.name }}</td>
                <td>{{ h.location }}</td>
                <td>{{ h.warden }}</td>
                <td>
                    <a href="{% url 'hostel_edit' h.id %}" class="btn btn-sm btn-warning">Edit</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No hostels found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
