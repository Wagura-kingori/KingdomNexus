{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ form.instance.id|yesno:"Edit Room,Add Room" }}</h2>

    <form method="post" class="card p-4 shadow">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success mt-3" type="submit">Save</button>
        <a href="{% url 'room_list' %}" class="btn btn-secondary mt-3">Back</a>
    </form>
</div>
{% endblock %}
