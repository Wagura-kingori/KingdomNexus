{% extends "base.html" %}
{% block title %}Category Form{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{{ title }}</h2>

    <form method="post">
        {% csrf_token %}

        <div class="card p-4 shadow-sm">
            <div class="mb-3">
                {{ form.name.label_tag }}
                {{ form.name }}
            </div>

            <div class="mb-3">
                {{ form.description.label_tag }}
                {{ form.description }}
            </div>

            <button class="btn btn-success">Save</button>
            <a href="{% url 'library:categories_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
