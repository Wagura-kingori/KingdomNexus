{% extends "base.html" %}
{% block content %}
<div class="container mt-4">

    <h3>Enter Results — {{ exam.name }}</h3>

    <form method="post">
        {% csrf_token %}

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.full_name }}</td>
                    <td>
                        <input type="number" name="score_{{ s.id }}" step="0.1" class="form-control" required>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Save Results</button>
    </form>

</div>
{% endblock %}
