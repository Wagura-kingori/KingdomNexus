{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h3>Take Attendance — {{ classroom.name }}</h3>
    <hr>

    <form method="post">
        {% csrf_token %}

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Student</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Late</th>
                    <th>Remarks</th>
                </tr>
            </thead>

            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.full_name }}</td>

                    <td>
                        <input type="radio" name="status_{{ s.id }}" value="present" required>
                    </td>
                    <td>
                        <input type="radio" name="status_{{ s.id }}" value="absent">
                    </td>
                    <td>
                        <input type="radio" name="status_{{ s.id }}" value="late">
                    </td>
                    <td>
                        <input type="text" name="remarks_{{ s.id }}" class="form-control">
                    </td>

                </tr>
                {% endfor %}
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Save Attendance</button>
    </form>

</div>
{% endblock %}
