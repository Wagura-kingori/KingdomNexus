{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h3>Attendance Records</h3>
    <hr>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Date</th>
                <th>Student</th>
                <th>Class</th>
                <th>Status</th>
                <th>Remarks</th>
            </tr>
        </thead>

        <tbody>
            {% for a in records %}
            <tr>
                <td>{{ a.date }}</td>
                <td>{{ a.student.full_name }}</td>
                <td>{{ a.classroom.name }}</td>
                <td style="text-transform: capitalize;">{{ a.status }}</td>
                <td>{{ a.remarks }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
