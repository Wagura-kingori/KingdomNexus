{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ result.id|yesno:"Edit Result,Add Exam Result" }}</h2>

    <form method="POST" class="mt-3">
        {% csrf_token %}

        <label class="form-label">Exam</label>
        <select name="exam" class="form-select mb-3">
            {% for e in exams %}
            <option value="{{ e.id }}" {% if result.exam_id==e.id %}selected{% endif %}>
                {{ e.exam_type }} - {{ e.subject }} - {{ e.class_level }}
            </option>
            {% endfor %}
        </select>

        <label class="form-label">Student</label>
        <select name="student" class="form-select mb-3">
            {% for s in students %}
            <option value="{{ s.id }}" {% if result.student_id==s.id %}selected{% endif %}>
                {{ s.name }}
            </option>
            {% endfor %}
        </select>

        <label class="form-label">Score</label>
        <input type="number" name="score" value="{{ result.score }}" class="form-control mb-3">

        <button class="btn btn-success">Save</button>
        <a href="{% url 'results_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
