{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ type.id|yesno:"Edit Exam Type,Add Exam Type" }}</h2>

    <form method="POST" class="mt-3">
        {% csrf_token %}

        <label class="form-label">Name</label>
        <input type="text" name="name" value="{{ type.name }}" class="form-control mb-3">

        <button class="btn btn-success">Save</button>
        <a href="{% url 'exam_types_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
