{% extends "dashboard_base.html" %}
{% load static %}

{% block content %}
<h2 class="mb-4">Create Notice</h2>

<div class="card p-3 shadow-sm">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success mt-2" type="submit">Save Notice</button>
    </form>
</div>
{% endblock %}
